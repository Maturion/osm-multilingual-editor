services:
  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - OSM_EDITOR_CONFIG=/app/config.yaml
    ports:
      - "8000:8000" # direct access for debugging; the proxy is the real entrypoint

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173" # direct access for debugging; the proxy is the real entrypoint

  proxy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/certs:/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  frontend_node_modules:
